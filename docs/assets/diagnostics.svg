<svg xmlns="http://www.w3.org/2000/svg" width="1326" height="435" viewBox="0 0 1326 435" role="img" aria-label="Drawio2Visio documentation figure"><rect width="100%" height="100%" rx="20" fill="#F3F6FB"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="57" font-size="30" fill="#142238" font-weight="700">Check before delivery</text><text x="40" y="93" font-size="18" fill="#60728A" font-weight="400">Every warning points back to a source ID. Strict mode stops conversion before writing files.</text><rect x="40" y="128" width="650" height="273" rx="12" fill="#fff" stroke="#D5DFEC"/><text x="66" y="165" font-size="22" fill="#142238" font-weight="700">compatibility.drawio</text><text x="66" y="207" font-size="20" fill="#142238" font-weight="400">2 nodes → 2 shapes</text><text x="66" y="246" font-size="20" fill="#142238" font-weight="400">2 edges → 1 connector</text><text x="66" y="297" font-size="17" fill="#92652A" font-weight="600">SHAPE_SIMPLIFIED  [database]</text><text x="66" y="335" font-size="17" fill="#92652A" font-weight="600">EDGE_OMITTED  [missing-endpoint]</text><rect x="726" y="128" width="560" height="273" rx="12" fill="#142238"/><text x="754" y="170" font-size="22" fill="#fff" font-weight="600">--report-only</text><text x="754" y="208" font-size="18" fill="#B7C7DE" font-weight="400">Inspect compatibility without exporting.</text><text x="754" y="264" font-size="22" fill="#fff" font-weight="600">--strict</text><text x="754" y="302" font-size="18" fill="#B7C7DE" font-weight="400">Any warning → non-zero exit; no new files.</text><text x="754" y="367" font-size="17" fill="#82B4FF" font-weight="400">JSON report + source IDs + actual dimensions</text></g></svg>
